# 안드로이드 소스를 바꾸면 설치 가능한 테스트 APK를 자동 빌드합니다.
name: 공기신호등 APK 빌드
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 안드로이드 APK 빌드 및 코드 검사
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: APK 파일 준비
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/air-signal-1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/air-signal-1.0.0.apk
          sha256sum artifacts/air-signal-1.0.0.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: air-signal-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
